name: Test Runner

on:
  workflow_dispatch:

jobs:

  test:

    runs-on:
      - self-hosted

    steps:

      - uses: actions/checkout@v4

      - name: Show hostname
        run: hostname

      - name: Show docker
        run: docker version

      - name: Show terraform
        run: terraform version

      - name: Show gcloud
        run: gcloud version
